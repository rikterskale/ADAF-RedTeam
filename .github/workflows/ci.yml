name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Release tags intentionally remain out of scope until signing, provenance,
  # publishing, and protected-environment inputs are defined.

# Default to least privilege at the workflow level; each job re-declares
# whatever it actually needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Deterministic, reproducible test output across matrix jobs.
  PYTHONHASHSEED: "0"

jobs:
  # ---------------------------------------------------------------------
  # Static: lint, byte-compile, workflow YAML lint, workflow security lint
  # ---------------------------------------------------------------------
  lint:
    name: Lint, compile, and workflow hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]" mypy bandit
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Mypy (type check)
        run: mypy adaf_redteam bridge scripts
      - name: Byte-compile Python sources
        run: python -m compileall -q adaf_redteam bridge scripts tests
      - name: Install workflow linters
        run: |
          python -m pip install "zizmor>=1.0"
          # actionlint via its official downloader; pinned to a released tag.
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash \
            | bash -s -- 1.7.7
      - name: Lint workflow YAML (actionlint)
        run: ./actionlint -color
      - name: Verify full-SHA action pins
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          pin = re.compile(r"^[^@\s]+@[0-9a-fA-F]{40}$")
          failures = []
          for workflow in sorted(Path(".github/workflows").glob("*.yml")):
              for number, line in enumerate(workflow.read_text(encoding="utf-8").splitlines(), start=1):
                  match = re.search(r"^\s*(?:-\s*)?uses:\s*([^\s#]+)", line)
                  if match and not match.group(1).startswith("./") and not pin.fullmatch(match.group(1)):
                      failures.append(f"{workflow}:{number}: {match.group(1)}")
          if failures:
              raise SystemExit("Unpinned or short-SHA actions:\n" + "\n".join(failures))
          print("All workflow action references use full 40-character commit SHAs.")
          PY
      - name: Security-lint workflow YAML (zizmor)
        # Persona=regular is the default; enable pedantic to surface every
        # supply-chain hint we can honor without changing the workflow shape.
        run: zizmor --persona=pedantic --min-severity=medium .github/workflows

  # ---------------------------------------------------------------------
  # Tests: full Python matrix on Linux; extra OS coverage on 3.12
  # ---------------------------------------------------------------------
  test:
    name: Test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Extra OS coverage: pick a single Python version so we exercise
          # every supported host without exploding runner minutes.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]" pytest-cov
      - name: Run tests with coverage and JUnit output
        # Pin the shell so backslash continuations parse the same everywhere;
        # Windows would otherwise use pwsh and reject the shell continuation.
        shell: bash
        run: |
          pytest -v --junitxml=junit.xml \
            --cov=adaf_redteam --cov=bridge --cov-report=term \
            --cov-branch --cov-fail-under=100 \
            --cov-report=xml:coverage.xml
      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage.xml ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          rate = float(root.attrib.get("line-rate", "0")) * 100
          branch = float(root.attrib.get("branch-rate", "0")) * 100
          print(f"### Coverage — {rate:.1f}% lines / {branch:.1f}% branches")
          PY
          fi
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------
  # Optional-capability dependency resolution and full test run under [all]
  # ---------------------------------------------------------------------
  optional-dependencies:
    name: Optional capability dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install every optional capability extra
        run: python -m pip install -e ".[all,dev]"
      - name: Check dependency resolution
        run: python -m pip check
      - name: Run tests with optional parser dependencies
        run: pytest -v

  # ---------------------------------------------------------------------
  # Schemas: both JSON schema files self-validate; example engagement conforms
  # ---------------------------------------------------------------------
  schema:
    name: Schema and example validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime and validator
        run: python -m pip install jsonschema
      - name: Validate schemas and committed examples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_dir = Path("schemas")
          engagement_schema = json.loads((schema_dir / "engagement.schema.json").read_text(encoding="utf-8"))
          result_schema = json.loads((schema_dir / "validation-result.schema.json").read_text(encoding="utf-8"))

          # Both schemas must themselves be valid Draft 2020-12.
          Draft202012Validator.check_schema(engagement_schema)
          Draft202012Validator.check_schema(result_schema)
          print("schemas: OK (Draft 2020-12)")

          # Committed example engagement must validate against its schema.
          example = json.loads(Path("examples/engagement.example.json").read_text(encoding="utf-8"))
          Draft202012Validator(engagement_schema).validate(example)
          print("examples/engagement.example.json: OK")

          # Any other examples that are JSON must at least parse.
          for path in Path("examples").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"{path}: parses OK")
          PY

  # ---------------------------------------------------------------------
  # Docs: generated reference stays in sync; novice-guide safety boundaries
  # ---------------------------------------------------------------------
  documentation:
    name: Documentation and examples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Verify generated capability reference
        run: python scripts/generate_capability_reference.py --check
      - name: Verify novice-guide safety boundaries
        run: python scripts/validate_novice_guides.py
      - name: Verify Markdown links and anchors
        run: python scripts/validate_docs.py

  # ---------------------------------------------------------------------
  # Package: sdist + wheel build with twine metadata check; upload artifacts
  # ---------------------------------------------------------------------
  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build source and wheel distributions
        run: |
          python -m pip install build twine
          export SOURCE_DATE_EPOCH=0
          export PYTHONHASHSEED=0
          python -m build --outdir dist-one
          python -m build --outdir dist-two
          twine check dist-one/*
          python - <<'PY'
          import gzip
          import hashlib
          import os
          import tarfile
          from pathlib import Path

          def normalize_sdist(path):
              temporary = path.with_suffix(path.suffix + ".normalized")
              with tarfile.open(path, "r:gz") as source, temporary.open("wb") as raw:
                  with gzip.GzipFile(fileobj=raw, mode="wb", mtime=0) as compressed:
                      with tarfile.open(fileobj=compressed, mode="w") as target:
                          for member in source:
                              member.mtime = 0
                              member.uid = member.gid = 0
                              member.uname = member.gname = ""
                              member.pax_headers = {}
                              content = source.extractfile(member) if member.isfile() else None
                              target.addfile(member, content)
              os.replace(temporary, path)

          for directory in (Path("dist-one"), Path("dist-two")):
              normalize_sdist(next(directory.glob("*.tar.gz")))

          def hashes(directory):
              return {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in Path(directory).iterdir() if p.is_file()}

          first, second = hashes("dist-one"), hashes("dist-two")
          artifacts = {name for name in first if name.endswith((".whl", ".tar.gz"))}
          assert artifacts == {name for name in second if name.endswith((".whl", ".tar.gz"))}
          assert all(first[name] == second[name] for name in artifacts), "non-reproducible artifact"
          Path("dist").mkdir()
          for source in Path("dist-one").iterdir():
              if source.suffix == ".whl" or source.name.endswith(".tar.gz"):
                  (Path("dist") / source.name).write_bytes(source.read_bytes())
          print("reproducible artifacts: OK")
          PY
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # Installed operator contracts: wheel and sdist, CLI, reports, schemas
  # ---------------------------------------------------------------------
  operator-contract:
    name: Installed operator contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [package]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Download and verify distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Verify checksums and artifact formats
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
      - name: Validate wheel-installed operator
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          source "$RUNNER_TEMP/wheel-venv/bin/activate"
          python -m pip install dist/*.whl
          python -m pip check
          adaf-redteam --help > help.txt
          adaf-redteam doctor --out operator-out > doctor.txt
          adaf-redteam doctor --json --out operator-out > doctor.json
          adaf-redteam list-capabilities > capabilities.txt
          adaf-redteam reference > reference.md
          adaf-redteam run --engagement examples/engagement.example.json \
            --capability adcs-esc1-validation --source-address 192.0.2.25 \
            --plan-only --out operator-out
          grep -q -- "--source-address" <(adaf-redteam run --help)
          grep -q -- "--plan-only" <(adaf-redteam run --help)
          grep -q -- "--json" <(adaf-redteam doctor --help)
          python - <<'PY'
          import hashlib, json
          from importlib.metadata import distribution
          from pathlib import Path
          from jsonschema import Draft202012Validator

          assert distribution("adaf-redteam").version == "0.1.0"
          import adaf_redteam
          assert "site-packages" in Path(adaf_redteam.__file__).as_posix()
          doctor = json.loads(Path("doctor.json").read_text())
          assert all(check["passed"] for check in doctor["checks"])
          plan_doc = json.loads(Path("operator-out/plan.json").read_text())
          manifest = json.loads(Path("operator-out/manifest.json").read_text())
          assert plan_doc["planOnly"] is True
          assert manifest["redacted"] is True and manifest["mode"] == "plan-only"
          assert manifest["capabilityId"] == plan_doc["plan"]["capabilityId"]
          plan_entry = next(item for item in manifest["artifacts"] if item["path"] == "plan.json")
          assert plan_entry["sha256"] == hashlib.sha256(Path("operator-out/plan.json").read_bytes()).hexdigest()
          engagement = json.loads(Path("examples/engagement.example.json").read_text())
          schema = json.loads(Path("schemas/engagement.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(engagement)
          print("operator contract: OK")
          PY
      - name: Validate installed offline result contract
        env:
          ADAF_REDTEAM_SCHEMA_DIR: ${{ github.workspace }}/schemas
        run: |
          adaf-redteam run --engagement examples/engagement.example.json \
            --capability asrep-roast-validation --source-address 192.0.2.25 \
            --target svc-asrep01 --finding-id F-0FF1CE0000000000 \
            --control-id ADAF-OFFLINE --fixture examples/offline-full-fixture.example.json \
            --out operator-execute > execute.txt
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          result = json.loads(Path("operator-execute/validation-result.json").read_text())
          manifest = json.loads(Path("operator-execute/manifest.json").read_text())
          schema = json.loads(Path("schemas/validation-result.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(result)

          assert result["capabilityId"] == "asrep-roast-validation"
          assert result["correlatesTo"] == {
              "FindingId": "F-0FF1CE0000000000",
              "ControlId": "ADAF-OFFLINE",
          }
          assert result["target"]["principal"] == "svc-asrep01"
          assert len(result["integrity"]["resultSha256"]) == 64
          result_entry = next(item for item in manifest["artifacts"]
                              if item["path"] == "validation-result.json")
          assert result_entry["sha256"] == hashlib.sha256(
              Path("operator-execute/validation-result.json").read_bytes()
          ).hexdigest()
          assert manifest["capabilityId"] == result["capabilityId"]
          print("installed offline result contract: OK")
          PY
      - name: Validate sdist-installed import and CLI
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          source "$RUNNER_TEMP/sdist-venv/bin/activate"
          python -m pip install dist/*.tar.gz
          python -m pip check
          python -c "import adaf_redteam; from importlib.metadata import version; assert version('adaf-redteam') == '0.1.0'"
          adaf-redteam --help

  # ---------------------------------------------------------------------
  # SBOM: CycloneDX inventory of the installed runtime environment
  # ---------------------------------------------------------------------
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package with every extra
        run: python -m pip install -e ".[all]"
      - name: Install CycloneDX generator
        run: python -m pip install cyclonedx-bom
      - name: Generate CycloneDX SBOM (JSON)
        run: |
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
          python -c "import json; from pathlib import Path; d=json.loads(Path('sbom.cdx.json').read_text()); assert d.get('bomFormat') == 'CycloneDX' and d.get('components') is not None"
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------
  # Supply-chain / secret scanning
  # ---------------------------------------------------------------------
  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # We `git grep` history-sensitive patterns; a full clone catches
          # accidental commits to any tracked file.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]" bandit
      - name: Audit installed dependencies
        run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/requirements-audit.txt"
          pip-audit --strict --requirement "$RUNNER_TEMP/requirements-audit.txt"
      - name: Check tracked content for known test-secret constant
        run: |
          if git grep -n "S3cr3t-Passw0rd-aabbccddeeff00112233" -- '*.json' '*.jsonl'; then
            echo "secret-shaped test constant found in tracked output" >&2
            exit 1
          fi
      - name: Check tracked content for private-key and provider-token shapes
        run: |
          if git grep -nE '-----BEGIN( [A-Z]+)? PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}' -- ':!tests/**' ':!review-output/**'; then
            echo "potential secret found in tracked content" >&2
            exit 1
          fi
      - name: Bandit security scan
        run: bandit -r adaf_redteam bridge scripts -q

  # ---------------------------------------------------------------------
  # CodeQL local analysis. Code Security is disabled, so upload is forbidden.
  # ---------------------------------------------------------------------
  codeql:
    name: CodeQL local analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          category: "/language:python"
          upload: never

  # ---------------------------------------------------------------------
  # Dockerfile lint (both Linux and Windows Dockerfiles)
  # ---------------------------------------------------------------------
  dockerfiles:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Lint Dockerfile (Linux)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3006: base image tag — the ARG resolves to a digest-pinned tag
          #         (python:3.12-slim-bookworm@sha256:...), which hadolint
          #         cannot see through the ARG substitution.
          # DL3008: pin apt versions — not applicable to python:*-slim.
          # DL3059: multiple consecutive RUN — intentional for image layer order.
          ignore: DL3006,DL3008,DL3059
      - name: Lint Dockerfile (Windows)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile.windows
          # Windows Dockerfiles use native Windows path syntax that hadolint,
          # which targets POSIX Docker, cannot parse:
          #   DL3021 — `COPY ... .\` reads as "no trailing /" but is the
          #            correct Windows form.
          #   DL4006 — Windows `RUN` executes under pwsh, not sh; the
          #            pipefail guidance does not apply.
          #   SC1001 — shellcheck-informational noise on `\w` / `\o` in the
          #            Windows path (`C:\adaf-redteam\...`), not shell escapes.
          #   DL3006 — the base image tag comes from an ARG that resolves to
          #            a digest-pinned reference; hadolint can't see through
          #            the ARG substitution.
          #   DL3008 — apt version pinning; not applicable on windowsservercore.
          #   DL3018 — apk version pinning; not applicable on windowsservercore.
          #   DL3059 — multiple consecutive RUN — intentional for layer order.
          ignore: DL3006,DL3008,DL3018,DL3021,DL3059,DL4006,SC1001

  # ---------------------------------------------------------------------
  # Container: build image, run doctor + plan-only smoke under hardened flags
  # ---------------------------------------------------------------------
  container:
    name: Container image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: [dockerfiles]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --pull --tag adaf-redteam:ci .
      - name: Verify hardened offline plan-only workflow
        run: |
          mkdir out
          docker run --rm --user "$(id -u):$(id -g)" --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount type=bind,source="$PWD/out",target=/out \
            adaf-redteam:ci doctor --out /out
          docker run --rm --user "$(id -u):$(id -g)" --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount type=bind,source="$PWD/out",target=/out \
            adaf-redteam:ci run --engagement examples/engagement.example.json \
            --capability adcs-esc1-validation --source-address 192.0.2.25 --plan-only --out /out
          test -s out/plan.json
          test -s out/manifest.json
      - name: Verify the container runs as an unprivileged user
        run: |
          uid=$(docker run --rm adaf-redteam:ci --help >/dev/null 2>&1 && \
                docker inspect adaf-redteam:ci --format '{{.Config.User}}')
          echo "container User: '$uid'"
          test "$uid" = "adaf"

  # ---------------------------------------------------------------------
  # Aggregation gate: single required status for branch protection
  # ---------------------------------------------------------------------
  production-readiness:
    name: Production readiness gate
    if: always()
    needs:
      - lint
      - test
      - optional-dependencies
      - schema
      - documentation
      - package
      - operator-contract
      - sbom
      - security
      - codeql
      - dockerfiles
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Fail if any required job did not succeed
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = [n for n, r in needs.items() if r.get("result") != "success"]
          if failed:
              print("FAILED jobs:", ", ".join(sorted(failed)))
              sys.exit(1)
          print("All required jobs succeeded.")
          PY
