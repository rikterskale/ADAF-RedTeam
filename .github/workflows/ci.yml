name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Compile Python sources
        run: python -m compileall -q adaf_redteam bridge scripts tests

  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests, including redaction checks
        run: pytest -v

  optional-dependencies:
    name: Test optional capability dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install all supported dependencies
        run: python -m pip install -e ".[all,dev]"
      - name: Check dependency resolution
        run: python -m pip check
      - name: Run tests with optional parser dependencies
        run: pytest -v

  documentation:
    name: Documentation and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Verify generated capability reference
        run: python scripts/generate_capability_reference.py --check
      - name: Verify novice-guide safety boundaries
        run: python scripts/validate_novice_guides.py
      - name: Verify Markdown links and anchors
        run: python scripts/validate_docs.py

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build source and wheel distributions
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Audit installed dependencies
        run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/requirements-audit.txt"
          pip-audit --strict --requirement "$RUNNER_TEMP/requirements-audit.txt"
      - name: Check tracked content for known test secrets
        run: |
          if git grep -n "S3cr3t-Passw0rd-aabbccddeeff00112233" -- '*.json' '*.jsonl'; then
            echo "secret-shaped test constant found in tracked output" >&2
            exit 1
          fi
      - name: Check tracked content for common private-key and token shapes
        run: |
          if git grep -nE '-----BEGIN( [A-Z]+)? PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}' -- ':!tests/**' ':!review-output/**'; then
            echo "potential secret found in tracked content" >&2
            exit 1
          fi

  container:
    name: Container image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --pull --tag adaf-redteam:ci .
      - name: Verify hardened offline plan-only workflow
        run: |
          mkdir out
          docker run --rm --user "$(id -u):$(id -g)" --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount type=bind,source="$PWD/out",target=/out \
            adaf-redteam:ci doctor --out /out
          docker run --rm --user "$(id -u):$(id -g)" --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount type=bind,source="$PWD/out",target=/out \
            adaf-redteam:ci run --engagement examples/engagement.example.json \
            --capability adcs-esc1-validation --source-address 192.0.2.25 --plan-only --out /out
          test -s out/plan.json
          test -s out/manifest.json
