name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (incl. redaction leak suite)
        run: pytest -v
      - name: Generated capability reference is current
        run: python scripts/generate_capability_reference.py --check
      - name: Novice guides are present and safely linked
        run: python scripts/validate_novice_guides.py
      - name: Dependency audit
        run: pip-audit || true
      - name: Secret-leak grep over tracked files
        run: |
          # Belt-and-braces: fail if a known secret-shaped test constant escapes into any tracked file.
          if grep -RIn "S3cr3t-Passw0rd-aabbccddeeff00112233" --include="*.json" --include="*.jsonl" .; then
            echo "secret-shaped string found in tracked output"; exit 1
          fi
  container:
    name: Container image smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --pull --tag adaf-redteam:ci .
      - name: Verify hardened offline plan-only workflow
        run: |
          mkdir out
          docker run --rm --user "$(id -u):$(id -g)" --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount type=bind,source="$PWD/out",target=/out \
            adaf-redteam:ci doctor --out /out
          docker run --rm --user "$(id -u):$(id -g)" --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount type=bind,source="$PWD/out",target=/out \
            adaf-redteam:ci run --engagement examples/engagement.example.json \
            --capability adcs-esc1-validation --source-address 192.0.2.25 --plan-only --out /out
          test -s out/plan.json
          test -s out/manifest.json
