[project]
name = "adaf-redteam"
version = "0.1.0"
description = "Authorization-first offensive validation tool that feeds redacted results back to ADAF."
license = { text = "LicenseRef-Proprietary" }
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
# Heavy offensive dependencies are added per-capability, behind extras.
# The Phase 1 read-only collector needs ldap3 (+ impacket for SD parsing).
ldap = ["ldap3>=2.9", "impacket>=0.11"]
kerberos = ["impacket>=0.11"]
adcs = ["impacket>=0.11"]
relay = ["impacket>=0.11"]
all = ["ldap3>=2.9", "impacket>=0.11"]
dev = ["ruff>=0.6", "pytest>=8.0", "pip-audit>=2.7"]

[project.scripts]
adaf-redteam = "adaf_redteam.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adaf_redteam*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
